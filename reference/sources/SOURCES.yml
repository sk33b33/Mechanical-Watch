# Phase 7.1 (docs/ROADMAP.md): real pallet/escape-wheel contact geometry,
# starting with drop — the escape wheel's free rotation between one
# pallet's tooth releasing and the next landing, entirely unmodeled before
# this (ASM-0023's own list: "locking, draw, drop, impact, sliding and
# banking geometry are not modeled").

- id: SRC-0036
  title: "An Analysis of the Lever Escapement"
  author: H. R. Playtner
  year: 1908
  type: watchmaking_reference
  url: https://gutenberg.org/files/21978/21978-h/21978-h.htm
  topics: [escapement, lever-escapement, drop, lock, draw, run, lift]
  claims_supported:
    - "Authorities on the subject allow 1½° drop for the club [tooth] and 2° for the ratchet tooth."
    - "Supposing we have a wheel with a primitive diameter of 7.5 mm., what is the amount of drop, allowing 1½° by angular measurement? 7.5 × 3.1416 ÷ 360 × 1.5 = .0983 mm." (angular drop converted to a linear clearance at the tip circle: arc length = radius × angle)
    - "the interval from tooth to tooth is 360÷15=24°; divided by 2 pallets = 24÷2 = 12° for width of tooth, pallet and drop" — i.e. for two beats per tooth, each beat's wheel-angle budget (tooth width + pallet width + drop, all measured at the escape wheel's own axis) is half the tooth pitch; worked as 12° = 4½° (tooth) + 6° (pallet) + 1½° (drop) for a 15-tooth wheel
    - "it is well to know that the angles for width of teeth, pallets and drop are measured from the wheel center, while the lifting and locking angles are struck from the pallet center" (drop is a wheel-side angle, distinct from the lever-side lock/run/lift angles already in this codebase's PalletGeometry)
    - "1½° is the angle generally allowed for the lock" (corroborates this project's existing teaching-movement lock angle, 2°, as the right order of magnitude, not identical)
    - "The draw... 12° on each [pallet]... the angle on the tooth is made just twice the amount, namely 24°" (corroborates the existing teaching-movement draw angle, 12°; also the practical doubling convention used by `toothDrawAngle`, ASM-0039)
    - "The locking planes when locked are inclined 12° from EB, and FB" (EB/FB being radii from the escape center through the locking points — the actual geometric referent of `PalletGeometry.drawAngle`, ASM-0039: inclination from the radial line through the locking point, not just an abstract scalar)
    - "it is certainly necessary that the point of the tooth alone should touch the pallet. From this it follows that the angle on the teeth must be greater than on the pallets... For practical reasons, from a manufacturing standpoint, the angle on the tooth is made just twice the amount, namely 24°; we could make it a little less or a little more. If we made it less than 20° too great a surface would be in contact with the jewel, involving greater friction in unlocking and an inefficient draw... or if the angle is made over 28°, the point or locking edge of the tooth would rapidly become worn" (the doubling convention is explicitly NOT a strict formula, with a cited practical working range of 20°-28° — `toothDrawAngle`/ESC-108)
    - "AC and AD... are tangents to the primitive circle GH. ABE and ABF are angles of 30° each... The locking circle MN is struck from the pallet center A; the interangles being equal, consequently the pallets must be equidistant... called the tangential escapement, on account of the unlocking taking place on the intersection of tangent AC with EB, and FB with AD" — identifies the equidistant pallet construction with the tangent-intersection ("tangential") construction this codebase's `tangentialCentreDistance`/`lockingPoints` already build
    - "The circular pallet is sometimes appropriately called 'the pallet with equal lifts,' as the lever arms AMO and ANP... are equal lengths... the pallets are bisected by the 30° lines EB and FB, one-half their width being placed on each side of these lines. In this pallet we have two locking circles, MP for the engaging pallet, and NO for the disengaging pallet" — the circular construction, locking off the tangent by an amount that grows with pallet width ("the narrower the circular pallet is made, the nearer to the tangent will the unlocking be performed") but with no closed-form offset stated
    - "Place the center of the protractor at B and draw the angle of width of pallets of 6°; IBE being for the engaging and JBF for the disengaging pallet. In the equidistant pallet IB is drawn on the side towards the center, while JB is drawn further from the center. If we were drawing a circular pallet, one-half the width of pallets would be placed on each side of EB and FB" (the worked 15-tooth specification's own pallet-width construction, 6°, matching the tooth/pallet/drop partition above)
    - "the wheel teeth of the 'club' form" (Playtner's own worked 15-tooth specification uses club teeth — the CLUB case of `EscapeWheel.toothKind`)
    - "the entire lifting angle is on the pallets" and "a metal point passing over a jeweled plane" (describing the older, English ratchet-tooth form: the tooth is a bare point with no impulse face of its own, so its own width may be zero — the RATCHET case of `EscapeWheel.toothKind`)
    - Fig. 5 ("Diagram illustrating Draw") and Fig. 28 ("The pallets when unlocked") were fetched and viewed directly (images/fig05.png, images/fig28.png) to confirm the pallet stone is drawn as a block with a flat locking face on the wheel-facing side, inclined off the radial — grounding, not literally reproducing, the straight-edged `generatePalletStoneOutline` construction (ASM-0040); the diagrams' own full construction (locked-vs-unlocked position correction, engaging/disengaging asymmetry) was not reverse-engineered point-for-point, only used to confirm the general shape and orientation
    - "the ruby pin, or strictly speaking, the 'impulse radius,' is a lever arm, whose length is measured from the center of the balance staff to the face of the ruby pin" (the geometric referent of `Balance.impulseRadius`, ASM-0041)
    - "the angles are in the inverse ratio to the radii. In other words, the shorter the radius, the greater is the angle, and the smaller the angle the greater is the radius" (the law `forkActingLength` implements: impulse angle × impulse radius ≈ lever angle × fork acting length, ASM-0041/ESC-109)
    - "some might use a proportion of 3.5, 4 or even 5 to 1" (impulse-angle-to-fork-angle proportions; the teaching movement's own 50°/10° = 5:1 matches this cited upper end)
    - "The acting length of fork = 4.5 mm., what is the amount of shake when the ruby pin passes the acting corner? 4.5 × 2 × 3.1416 ÷ 360° = .0785 × 1.25 = .0992 mm." (Playtner's own worked fork-acting-length figure, 4.5 mm — used, divided by the teaching movement's own 5:1 ratio, to choose its impulse radius of 0.9 mm; not a universal value, a single worked example)
    - "The ruby pin in entering the fork must have a certain amount of freedom for action, from 1 to 1¼°." (the cited range for `PalletGeometry.rubyPinEntryFreedom`, ASM-0042)
    - "It is important that the angular freedom between the fork and ruby pin at the moment it enters into the slot be less than the total locking angle on the pallets. If we employ a locking angle of 1½° and ½° run, we would have a total lock on the pallets of 2°. By allowing 1¼° of freedom for the ruby pin at the moment the guard point enters the crescent, in case the fork should strike the face of the ruby pin, the pallets will still be locked ¾° and the fork drawn back against the bankings through the draft angle." (the hard geometric necessity ESC-110 checks: entry freedom strictly less than lock + run; the teaching movement's own 1¼° entry freedom is Playtner's exact cited number)
    - "The shake of the ruby pin in the slot of the fork must be as slight as possible, consistent with perfect freedom of action. It varies from ¼° to ½°, according to length of fork and shape of ruby pin." (the cited range for `PalletGeometry.rubyPinSlotShake`, ASM-0042)
    - "We would choose a ruby pin of a width equal to half the angular motion of the fork." (the convention `suggestedRubyPinWidth` implements — a cited choice, not a strict formula, ASM-0042)
    - "in the single roller the safety action is at the mercy of the impulse and pallet angles. We have noticed that in order to favor the impulse we require a large roller, and for the safety action a small one, therefore escapements made on fine principles are supplied with two rollers, one for each action." (the geometric trade-off `Balance.rollerKind` names: SINGLE | DOUBLE, ASM-0043)
    - "It may be well to say that in our opinion a proportion between the fork and impulse angles in 10° pallets of 3 or 3½ to 1, depending upon the size of the escapement, is the lowest which should be made in single roller. We have seen them in proportions of 2 to 1 in single roller—a scientific principle foolishly applied—resulting in an action entirely unsatisfactory." (the cited single-roller fork-ratio floor, ESC-111 — Playtner's own hedged figure, not checked for DOUBLE)
    - "When the guard point is pressed against the roller the escape tooth must still rest on the locking face of the pallet; if the total lock is 2°, by allowing 1¼° freedom for the guard point between the bank and the roller the escapement will still be locked ¾°. How much this shake actually amounts to depends upon the guard radius. Suppose this to be 4 mm., then the freedom would equal 4 × 2 × 3.1416 ÷ 360 × 1.25 = .0873 mm." (the same hard necessity as ESC-110 applied to the guard point — `PalletGeometry.guardPointFreedom` strictly under the total lock — and Playtner's own worked numbers, reproduced exactly by the teaching movement's guardPointFreedom=1¼°/guardPointRadius=4mm, `guardPointClearance`, ASM-0043)
  claims_to_check: []
  retrieved: true
  accessed: "2026-10-05"
  notes: >
    Tier 4 (a recognized, book-length, primary watchmaking text devoted
    specifically to lever-escapement geometry — stronger than a derived
    secondary source like SRC-0026/SRC-0035), freely available via Project
    Gutenberg (public domain, 1908). Read directly (fetched the raw HTML
    with curl and read it with the Read tool — WebFetch's own isolated
    summarizer compressed the chapters too aggressively to extract the
    worked formulas faithfully, the same kind of lossy-extraction issue
    this project has hit with scanned-image PDFs, but for a different
    reason: an HTML page is not saved locally by WebFetch the way a
    binary PDF is, so the curl-then-Read workaround was used instead).
    Used for ASM-0036 (`PalletGeometry.dropAngle`, `wheelAngleBudgetPerBeat`,
    `dropClearance` in `src/kinematics/palletGeometry.ts`), ASM-0037
    (`PalletGeometry.kind`, `widthAngle`, `toothWidthAngle`), ASM-0038
    (`EscapeWheel.toothKind`, CLUB | RATCHET), ASM-0039 (`drawAngle`'s
    geometric referent, `toothDrawAngle`), ASM-0040 (the real 2D
    tooth/pallet-stone outlines in `src/geometry/assemblyGeometry3d.ts`),
    ASM-0041 (`Balance.impulseRadius`, `forkActingLength`), ASM-0042
    (`PalletGeometry.rubyPinEntryFreedom`, `rubyPinSlotShake`,
    `suggestedRubyPinWidth` — the second piece of the book's separate
    "Fork and Roller Action" chapter used in this project) and ASM-0043
    (`Balance.rollerKind`, `PalletGeometry.guardPointFreedom`,
    `guardPointRadius`, `guardPointClearance` — drawn from the book's
    "The Safety Action" chapter), and the
    ESC-106 (hard geometric budget, derived — not just cited; type-aware
    since ASM-0038) / ESC-107 (informal drop advisory — 1.5° club / 2°
    ratchet, cited; derived tooth width) / ESC-108 (derived escape-tooth
    locking face, conventional doubling, advisory outside the cited
    20°-28° range) / ESC-109 (derived fork acting length) / ESC-110
    (ruby-pin entry freedom strictly under the total lock — a hard
    necessity, not just cited; slot shake; the suggested width) / ESC-111
    (guard-point freedom strictly under the total lock, the same hard
    necessity; guard-point radius; the derived guard-point clearance; the
    single-roller fork-ratio-floor advisory) validation
    rules. Re-read directly from the same locally cached HTML (no
    re-fetch needed) for the "The Draw" and "The Fork and Roller Action"
    chapters' exact language, and this pass additionally fetched two of
    the chapter's own figures (fig05.png, fig28.png — redirected through
    www.gutenberg.org, fetched with curl -L) and viewed them directly
    (the same "fetch the image, read it as an image" workaround already
    used for SRC-0037's formula images) to confirm the pallet stone's
    general block-with-a-leaning-face shape before implementing ASM-0040
    — not to reverse-engineer the diagrams' full construction
    point-for-point. A later pass re-read the same cached HTML for "The
    Safety Action" chapter's exact language (single vs. double roller,
    guard-point freedom and radius) without re-fetching. Eight pieces of
    this chapter's material are now used across these eight assumptions
    (drop; pallet type and width; tooth type; draw/tooth-face angle; the
    2D outlines; impulse radius/fork length; ruby-pin entry
    freedom/slot shake/suggested width; roller kind/guard-point
    freedom/radius/clearance); the book's larger remaining treatment of
    true lifting-face curvature, the tooth/pallet FACE contact geometry
    itself, the real/primitive-circle correction, the
    engaging/disengaging asymmetry and the locked-vs-unlocked
    face-position correction remains unmodeled, as does most of "The
    Fork and Roller Action" still (the fuller width/freedom/impulse-
    radius relationship in Figs. 17-20, the Savage pin roller), the rest
    of "The Safety Action" (the dart's own shape, the fuller
    roller/crescent geometric relationship), "The Crescent" (angular
    opening) and "The Horn" (length, freedom) chapters — explicitly out
    of scope here, scoped as Phase 7.1.5's later sub-items
    (`docs/ROADMAP.md`) rather than attempted incompletely now. The
    CIRCULAR pallet type is named in the domain model (ASM-0037) but not
    implemented: this source states only that its locking offset from
    the tangent shrinks with pallet width, not a closed-form formula for
    it.

