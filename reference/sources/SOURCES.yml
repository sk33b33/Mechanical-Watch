- id: SRC-0017
  title: "Escape wheel question (NAWCC Forums thread)"
  author: Richmccarty, and other posters
  year: 2008
  type: forum_discussion
  url: https://mb.nawcc.org/threads/escape-wheel-question.37500/
  topics: [escapement, beat-rate]
  claims_supported:
    - "The EW [escape wheel] teeth are counted twice because it moves 1/2 a tooth per pendulum beat."
  claims_to_check: []
  retrieved: true
  accessed: '2026-10-01'
  notes: >
    Read 2026-10-01 (post by Richmccarty, 11 Jan 2008, re: a longcase
    clock with a one-second pendulum and seconds hand). Tier 7, like
    SRC-0011/SRC-0012/SRC-0013: forum testimony, not a published source.
    States the same half-tooth-per-beat relation as SRC-0016,
    independently, for a pendulum clock escapement rather than a watch
    lever escapement — the same locking-escapement structure (alternating
    entrance/exit pallets) ASM-0021 assumes, so it is read as
    corroborating rather than off-scope. Used only to corroborate
    SRC-0016 for the ASM-0021 citation, the same role SRC-0013 plays for
    SRC-0012.

    Conflict note: Wikipedia's Lever escapement article (fetched
    2026-10-01, https://en.wikipedia.org/wiki/Lever_escapement) states
    "Each back and forth movement of the balance wheel from and back to
    its center position corresponds to a drop of one tooth (called a
    beat)" — read literally, one tooth per beat (z beats/revolution, not
    2z). Per CLAUDE_REFERENCE_INSTRUCTIONS.md rule 12, this is recorded
    rather than hidden. It is not treated as closing evidence against
    ASM-0021/SRC-0016/SRC-0017 for three reasons: (1) "drop" is a
    specific horological term for the small free rotation between
    release and the next locking, not a synonym for "advance", so the
    sentence may describe a drop event occurring within the beat rather
    than claim the wheel advances a full tooth pitch per beat; (2) the
    standard, widely-taught watch/clock gear-train design formula
    (SRC-0016, corroborated by SRC-0017) explicitly multiplies the escape
    wheel tooth count by 2 and explains why in mechanical terms (entrance
    and exit pallet), which a single ambiguous encyclopedia sentence does
    not outweigh; (3) the alternating two-pallet structure this
    codebase's own pallet geometry models (ASM-0025, a span of k + ½
    teeth between the pallets) mechanically requires two releases per
    tooth pitch of travel, consistent with SRC-0016/SRC-0017 and
    inconsistent with one release per tooth pitch. ASM-0021 is still
    recorded as "accepted for the simplified model" rather than
    VERIFIED_STANDARD, since even SRC-0016/SRC-0017 are Tier 6/7.

