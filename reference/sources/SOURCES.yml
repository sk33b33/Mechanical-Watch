- id: SRC-0007
  title: ISO 23509:2016 Bevel and hypoid gear geometry
  author: ISO
  year: 2016
  type: standard
  url: https://www.iso.org/standard/63832.html
  topics: [gear-geometry, bevel-gears]
  claims_supported: []
  claims_to_check:
    - speed ratio of intersecting-axis (bevel/crown) gears equals the inverse tooth-count ratio
    - relation between pitch angles, shaft angle and tooth counts
  retrieved: false
  accessed: null
  notes: >
    Tier 1 standard for generic machine bevel gears. Second edition,
    replaces ISO 23509:2006. Would support the rolling-pitch-cone ratio
    used by crossedMeshSpeedRatio, not horological contrate or winding
    tooth forms (CLAUDE_REFERENCE_INSTRUCTIONS.md rule 10).

