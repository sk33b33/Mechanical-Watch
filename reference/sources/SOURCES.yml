  claims_to_check: []
  retrieved: true
  accessed: '2026-09-26'
  notes: >
    Read 2026-09-26. States the general tooth-count speed-ratio relation
    for two meshing gears, from the ratio of pitch-circle radii. Its own
    derivation and examples are for spur/parallel-axis gears; the article
    does not itself state that this extends to bevel or other
    crossed/intersecting-axis meshes (checked; not present in this
