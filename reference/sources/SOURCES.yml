- id: SRC-0011
  title: "Watchmaking tolerances (NAWCC Forums thread)"
  author: DeweyC (Dewey Clark), Dave Coatsworth, Al J, and other posters
  year: 2023
  type: forum_discussion
  url: https://mb.nawcc.org/threads/watchmaking-tolerances.198231/
  topics: [bearings, side-shake, endshake, tolerances]
  claims_supported:
    - "escapement parts are held to .05mm endshake. Train wheels can be .10mm."
    - "Jewels are generally 1 size over the pivot diameter."
    - "Train hole distances today? I would suspect they are held to 5 microns or so."
    - "the convention is one hundredth of a millimeter difference [between a balance pivot and its jewel hole]. (e.g., a .12mm balance pivot would require a .13mm balance hole jewel.) Illinois and Hamilton, however, provided jewels in 'half sizes' [.005mm difference]."
  claims_to_check: []
  retrieved: true
  accessed: '2026-09-26'
  notes: >
    Read 2026-09-26 (NAWCC = National Association of Watch and Clock
    Collectors; a Watch Repair sub-forum thread, 21 posts, opened 22 May
    2023). Tier 6, like
    SRC-0003 (Watchmaking.com): forum testimony from named posters
    recalling figures from memory and (per DeweyC) unnamed Hamilton
    factory production-sheet access, not a published standard, textbook
    or manufacturer datasheet. DeweyC gives the endshake figures used for
    ASM-0028/BRG-006 (escapement parts .05mm, train wheels .10mm) and a
    vaguer side-shake figure ("1 size over the pivot diameter", no mm
    value given). Dave Coatsworth gives a more precise but
    balance-staff-specific side-shake figure (.01mm nominal difference,
    .005mm for Illinois/Hamilton "half sizes") — too narrow (one
    component, one poster, a single point value rather than a range) to
    turn into a codebase-wide side-shake advisory without inventing a
    band around it; a usable range came later from SRC-0012 instead
    (BRG-007, ASM-0029). Poster Al J
    explicitly cautions: "manufacturing tolerances are very different
    from desired clearances like end shake for example - these often get
    confused" — read as support for treating these as this project's own
    ASM-0011/ASM-0013 clearances, not AGMA-style manufacturing
    tolerances. Used only for the low-confidence BRG-006 informational
    advisory (never a pass/fail limit), per an explicit decision to treat
    forum-sourced figures this way rather than as validated evidence or
    to hold out for a published source.

    Separately, Coatsworth's worked example (a .12mm pivot paired with a
    .13mm jewel hole, both diameters) closes a different open question —
    ASM-0013, whether "side shake" as reported by this codebase (bore Ø
    − pivot Ø, a diametral measure) matches the horological convention.
    Since .12mm and .13mm are both diameters, their .01mm difference is
    inherently diametral, not radial; calling that 0.01mm "the
    convention" for side shake (2026-10-01 re-read for this question)
    supports reading community "side shake" figures as diametral
    clearance, the same convention `sideShake` in assemblyGeometry.ts
    uses. Still Tier 6 (forum testimony); no source found states
    "diametral" or "radial" outright (checked again in SRC-0012's
    thread too — absent there as well), so this is read from the
    arithmetic of the worked example, not an explicit statement.

