# Wikipedia was added to this environment's allowed network hosts on
# 2026-09-26. Read to see whether it could close the ASM-0019 citation
# above. It only partly does; see notes.

- id: SRC-0009
  title: "Gear train"
  author: Wikipedia contributors
  year: null
  type: encyclopedia
  url: https://en.wikipedia.org/wiki/Gear_train
  topics: [gear-geometry, gear-ratio]
  claims_supported:
    - for two meshing gears, the angular speed ratio equals the inverse ratio of pitch-circle radii, equivalently the inverse ratio of tooth counts (|omega_A|/|omega_B| = r_B/r_A = N_B/N_A)
  claims_to_check: []
  retrieved: true
  accessed: '2026-09-26'
  notes: >
    Read 2026-09-26. States the general tooth-count speed-ratio relation
    for two meshing gears, from the ratio of pitch-circle radii. Its own
    derivation and examples are for spur/parallel-axis gears; the article
    does not itself state that this extends to bevel or other
    crossed/intersecting-axis meshes (checked; not present in this
    article or in Wikipedia's Bevel gear article, which has no
    quantitative ratio formula at all). The Bevel gear article was also
    read and found to give no formula. So SRC-0009 supports the general
    kinematic principle behind `crossedMeshSpeedRatio` (equal
    pitch-circle/contact-point velocity implies a tooth-count ratio) but
    does not, on its own, close the citation for applying that principle
    to a crossed-axis mesh. See SRC-0010 for that extension.

# The user also supplied two candidate papers directly. IJEDR1802006 was
# read and rejected: an FEM bending-stress/AGMA strength analysis of a
# bevel gear tooth, unrelated to the velocity-ratio claim, and a weak
# source generally. JAMDSM 2026jamdsm0019 was read and is the closing
# citation for ASM-0019's crossed-axis extension; see SRC-0010.

- id: SRC-0010
  title: "Machining calculation and tooth surface modification method of circular arc equal-height spiral bevel gear based on line conjugation"
  author: Shaowu Nie, Chuang Jiang, Zhengyang Han, Longlong Geng
  year: 2026
  type: peer_reviewed
  url: https://doi.org/10.1299/jamdsm.2026jamdsm0019
  topics: [gear-geometry, bevel-gears, gear-ratio]
  claims_supported:
    - "for a pinion/gear (bevel) pair in line-conjugate mesh, the rotation angles satisfy i12 = psi2/psi1 = z1/z2, where z1, z2 are the pinion and gear tooth counts — i.e. the transmission ratio of an intersecting-axis gear pair is the inverse tooth-count ratio, the same relation as for parallel (spur) gears"
  claims_to_check: []
  retrieved: true
  accessed: '2026-09-26'
  notes: >
    Read 2026-09-26 (Bulletin of the JSME, Journal of Advanced Mechanical
    Design, Systems, and Manufacturing, Vol.20 No.2 (2026), Paper
    No.26-00183, DOI 10.1299/jamdsm.2026jamdsm0019, Henan University of
    Science and Technology; peer-reviewed, open access). Section 4
    ("Calculation of principal directions and principal curvatures of
    pinion tooth surface with line conjugation"), introducing Fig. 5's
    tooth meshing model, states as a premise of the line-conjugate mesh:
    "the pinion angle and the gear angle meet i12 = psi2/psi1 = z1/z2.
    Here, z1 and z2 are the number of teeth of the pinion and gear
    respectively." (nomenclature also defines i12 as "the transmission
    ratio between the pinion and gear"). This is stated for the paper's
    circular-arc equal-height spiral bevel gear, an intersecting-axis
    (bevel-type) pair, and directly closes the ASM-0019 claim SRC-0007/
    SRC-0008 were recorded for: that the tooth-count ratio gives the
    rotation/speed ratio of a crossed-axis mesh, not just a parallel one.
    Like SRC-0007/SRC-0008, this is a generic machine-gear (spiral bevel)
    source, not horological (CLAUDE_REFERENCE_INSTRUCTIONS.md rule 10);
    the winding/keyless-works tooth forms in this codebase remain
    unvalidated against any horological source. The paper's own subject
    (tooth-surface machining/modification) is unrelated and not used
    here — only the transmission-ratio premise in §4 is cited.

