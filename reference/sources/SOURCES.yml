- id: SRC-0012
  title: "Jewel hole dimensions (NAWCC Forums thread)"
  author: Dushan Grujich, citing Hans Jendritzki
  year: 2020
  type: forum_discussion
  url: https://mb.nawcc.org/threads/jewel-hole-dimensions.171918/
  topics: [bearings, side-shake, jewel-holes]
  claims_supported:
    - "the required side shake suggested by Hans Jendritzki to practising watchmakers, is within the range of 1/100 to 2/100 mm for watches. Side shake of 1/100 mm for pivots up to 30/100 mm, and side shake of 2/100 mm for the larger pivots."
  claims_to_check: []
  retrieved: true
  accessed: '2026-09-30'
  notes: >
    Read 2026-09-30 (NAWCC thread "Jewel hole dimensions", post by Dushan
    Grujich, 20 August 2020). Tier 6, like SRC-0003/SRC-0011: a forum
    post, not the primary source itself. But more specific than SRC-0011
    (a two-band rule keyed to pivot diameter, not a single point value)
    and better attributed: it names Hans Jendritzki, a real, specific,
    identifiable watchmaking instructor, author of "Watch Adjustment"
    (1961/1963), described independently (in the unrelated
    historictimekeepers.com "Watch Adjustment" article by Dewey Clark —
    the same person behind SRC-0011 — as "the most complete work on
    watch adjustment" and still in print through WOSTEP's founder's
    publishing house, booksimonin.ch) as a recognized authority, not an
    anonymous forum guess. The same post also cites a formula-based
    approach in M. Handelsmann, "Jewelled bearings" (1973), for deriving
    optimal jewel-hole diameter from pivot diameter, lubricant and
    bearing load — not itself used here (no formula quoted, only that it
    exists), but recorded in case it becomes findable later. Neither
    Jendritzki's book nor the Handelsmann book was read directly; this
    remains a secondhand (forum-paraphrased) citation of both, so it is
    used the same way as SRC-0011: a BRG-007 informational advisory
    (ASM-0029), not a validated acceptable range.

