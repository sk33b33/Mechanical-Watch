# Candidate sources for the right-angle (stem) mesh relationship, ASM-0019.
# Found by web search on 2026-09-26. Neither has been read: fetching them
# was blocked by this environment's network policy, and ISO 23509 is a
# paid standard. They are recorded so the citation can be completed, not
# as evidence. As of 2026-09-26 the citation is closed by SRC-0010
# instead (see below); both stay recorded, unread, for the trail.

- id: SRC-0007
  title: ISO 23509:2016 Bevel and hypoid gear geometry
  author: ISO
  year: 2016
  type: standard
  url: https://www.iso.org/standard/63832.html
  topics: [gear-geometry, bevel-gears]
  claims_supported: []
  claims_to_check:
    - speed ratio of intersecting-axis (bevel/crown) gears equals the inverse tooth-count ratio
    - relation between pitch angles, shaft angle and tooth counts
  retrieved: false
  accessed: null
  notes: >
    Tier 1 standard for generic machine bevel gears. Second edition,
    replaces ISO 23509:2006. Would support the rolling-pitch-cone ratio
    used by crossedMeshSpeedRatio, not horological contrate or winding
    tooth forms (CLAUDE_REFERENCE_INSTRUCTIONS.md rule 10). Superseded
    for the ASM-0019 citation by SRC-0010, which states the same relation
    directly and was actually read; left here unread rather than removed,
    per the rule to never hide an assumption or its evidence trail. Still
    paid, still not accessed.

